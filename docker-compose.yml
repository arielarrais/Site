services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_URLS: "http://0.0.0.0:3001"
      ClientPath: "/app/client"
      JwtSecret: ${JWT_SECRET:?defina JWT_SECRET no .env (rode scripts/gerar-jwt-secret.ps1)}
      BrapiToken: ${BRAPI_TOKEN:-}
      GoogleApiKey: ${GOOGLE_API_KEY:-}
      AllowSelfRegistration: ${ALLOW_SELF_REGISTRATION:-false}
    ports:
      - "3001:3001"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_DOMAIN: "${DUCKDNS_DOMAIN:?defina DUCKDNS_DOMAIN no .env (rode scripts/instalar-tarefa-ddns.ps1)}.duckdns.org"
      SITE_BASIC_AUTH_USER: ${SITE_BASIC_AUTH_USER:?defina SITE_BASIC_AUTH_USER no .env}
      SITE_BASIC_AUTH_HASH: ${SITE_BASIC_AUTH_HASH:?defina SITE_BASIC_AUTH_HASH no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
